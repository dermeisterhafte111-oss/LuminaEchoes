name: "Build & Release Lumina Echoes (Godot 4)"

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  export-windows:
    name: "Export Windows .exe"
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2.1

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot Export Templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.2.1.stable
          cp -r /root/.local/share/godot/export_templates/4.2.1.stable/* ~/.local/share/godot/export_templates/4.2.1.stable/ || true

      - name: Prepare Build Output Directory
        run: |
          mkdir -p builds

      - name: Export Windows Desktop Binary
        run: |
          godot --headless --verbose --export-release "Windows Desktop" builds/LuminaEchoes.exe

      - name: Package Executable into Zip Artifact
        run: |
          cd builds
          zip -r ../LuminaEchoes-Windows.zip .
          cd ..

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LuminaEchoes-Windows-Build
          path: LuminaEchoes-Windows.zip

      - name: Publish GitHub Release (On Tags or Main Push)
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          files: LuminaEchoes-Windows.zip
          name: "Lumina Echoes Release ${{ github.ref_name }}"
          body: |
            Automated production build generated by GitHub Actions.
            - Engine: Godot 4.2
            - Platform: Windows 64-bit (.exe)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
